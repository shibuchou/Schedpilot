# SchedPilot Redis benchmark instance (flagship scenario).
# Started by bench/abcd_experiment.sh with a fixed CPU pinning set.
port 6399
bind 127.0.0.1
protected-mode no
daemonize no
save ""
appendonly no
logfile ""
dir /tmp/schedpilot-redis
maxmemory 2gb
maxmemory-policy allkeys-lru
io-threads 1
tcp-backlog 511
hz 10
