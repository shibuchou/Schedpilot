worker_processes 2;
pid /tmp/schedpilot-nginx.pid;
error_log /tmp/schedpilot-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080 backlog=4096 reuseport;
        root /tmp/schedpilot-www;
        location / {
            try_files /index.html =404;
        }
    }
}
