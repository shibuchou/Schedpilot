# SchedPilot daemon config: Redis scenario, DIAGNOSTIC VARIANT ("no BG").
# bg.process_names is intentionally empty. This config is an ablation used to
# bisect the formal-3 Redis regression (see docs/04_test_report.md 6.10);
# for normal use deploy configs/redis.conf.
[targets]
process_names = redis-server
exclude_names = redis-benchmark, memtier_benchmark, memtier, schedpilotd, scx_schedpilot

[bg]
process_names =

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
hysteresis_cycles = 10
lat_moderate = true

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
