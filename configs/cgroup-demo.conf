# SchedPilot daemon config: container / cgroup-based targeting demo.
#
# Instead of matching process names, every process inside the given cgroup v2
# subtrees (recursively) is selected: the redis subtree as normal targets, the
# stress subtree as background (BG). Name-based lists may be combined with
# cgroup lists; exclude_names always applies.
#
# Create the cgroups and move processes into them (cgroup v2), e.g.:
#   mkdir -p /sys/fs/cgroup/schedpilot-test/{redis,stress}
#   ( echo $BASHPID > /sys/fs/cgroup/schedpilot-test/redis/cgroup.procs; exec redis-server --port 6399 ... )
#   ( echo $BASHPID > /sys/fs/cgroup/schedpilot-test/stress/cgroup.procs; exec stress-ng --cpu 4 ... )
# (in bash use $BASHPID, not $$, so the moved PID is the one that execs the
#  workload; systemd-run --scope/--unit also works)
# Then:
#   scripts/schedpilotctl.sh start --mode adaptive --config configs/cgroup-demo.conf
# or run the regression test:
#   tests/test_cgroup_targeting.sh   (auto-detects cgroup2; on legacy v1
#   systems it mounts cgroup2 under /tmp and rewrites these paths)
#
# Note: paths are validated as real cgroup v2 directories (cgroup.controllers
# must exist); adjust them to your mount point if cgroup2 is not at
# /sys/fs/cgroup (e.g. /sys/fs/cgroup/unified on hybrid systems).

[targets]
process_names =
cgroup_paths = /sys/fs/cgroup/schedpilot-test/redis
exclude_names = redis-benchmark, memtier_benchmark, memtier, schedpilotd, scx_schedpilot

[bg]
process_names =
cgroup_paths = /sys/fs/cgroup/schedpilot-test/stress

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
lat_moderate = true
hysteresis_cycles = 10

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
