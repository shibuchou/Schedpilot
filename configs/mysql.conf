# SchedPilot daemon config: MySQL OLTP scenario.
# The sysbench client and control daemon are excluded from classification.

[targets]
process_names = mysqld
exclude_names = sysbench, mysql, mysqlslap, schedpilotd, scx_schedpilot, redis-benchmark, wrk

[bg]
process_names = stress-ng

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
hysteresis_cycles = 10
# MySQL sync threads are wake-heavy but throughput-oriented: keep the
# PMU-based classification (COMP/CACHE) instead of the moderate-wake
# L-SYNC rule, which would put them on the short-slice LAT path.
lat_moderate = false

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
