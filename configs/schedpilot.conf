# SchedPilot default daemon config (v0.3 provincial MVP)
# All keys are optional; defaults are shown.

[targets]
# Process names (matches /proc/<pid>/comm; comm is truncated to 15 chars).
# Classification/PMU sampling only applies to these targets.
process_names = redis-server
# Never classify these (e.g. the benchmark client when co-located).
exclude_names = redis-benchmark, memtier_benchmark, memtier, schedpilotd, scx_schedpilot

[bg]
# Externally marked background/interference tasks. No automatic BG
# classification in the MVP; marking is explicit configuration only.
process_names = stress-ng

[classifier]
# EWMA smoothing factor for all features.
alpha = 0.3
# L-SYNC rule: wakeups/s, average runtime, average run delay.
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
# C-COMPUTE / M-BOUND split from PMU features.
ipc_hi = 1.2
mpki_hi = 10.0
# Consecutive cycles a candidate class must hold before switching.
hysteresis_cycles = 10

[policy]
# Slow control loop interval in milliseconds.
interval_ms = 100
# Adaptive knob control (D arm). off = classification only (C arm).
adaptive = true
# Ablation switches.
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
# JSONL logs are written here (samples, policy updates, start/stop).
dir = logs
