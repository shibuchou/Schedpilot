# SchedPilot daemon config: Nginx web-server scenario.
#
# RECOMMENDED RUN MODE: basic
#   scripts/deploy_nginx.sh          # 部署入口（验证 sched_ext enabled）
#   schedpilotctl.sh start --mode basic
# B (basic) is the measured best configuration for Nginx in this scenario
# (+43.8% QPS, p99 -37.7%, p<0.0001, n=20, see docs/04_test_report.md §6.9).
# Classification mode (class/adaptive) raises Nginx tail latency; tuning it
# is tracked as P1. This config remains for C/D ablation/reference runs.
# Regression test for this deployment entry: tests/test_nginx_basic.sh.
#
# Benchmark client (wrk) and the control daemon are excluded from
# classification; background interference is marked explicitly.

[targets]
process_names = nginx
exclude_names = wrk, schedpilotd, scx_schedpilot, redis-benchmark, sysbench

[bg]
process_names = stress-ng

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
lat_moderate = true
hysteresis_cycles = 10

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
