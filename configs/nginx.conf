# SchedPilot daemon config: Nginx web-server scenario.
#
# RECOMMENDED RUN MODE: adaptive
#   scripts/deploy_nginx.sh          # 部署入口（验证 sched_ext enabled）
#   schedpilotctl.sh start --mode adaptive --config configs/nginx.conf
# Classification mode is the measured-best configuration for Nginx in this
# scenario. Frozen rerun nginx-7 (scenario v3, 20 runs x 60s, 0 invalid):
#   C (static classification, --policy off): +167.8% QPS median
#       (paired +167.81% [+141.06, +194.56], 20/20 higher)
#       p99 -66.4% median (paired -69.61%, 20/20 lower)
#   D (adaptive): +138.1% QPS median (paired +169.82% [+142.58, +197.06], 20/20)
#       p99 median -66.7% (paired -69.63%, 20/20 lower)
#   => D and C are statistically tied; adaptive is the default.
#   basic (B) remains the conservative fallback:
#       +42.9% QPS median (paired +61.14% [+44.61, +77.67], 20/20), p99 -36.3%.
# Earlier builds showed classification-mode tail-latency issues on Nginx
# (docs/04_test_report.md §6.9); those were resolved by the migration-penalty
# cap and BG-slice fixes, and §6.10 supersedes §6.9 on this point.
# Regression test for the basic fallback entry: tests/test_nginx_basic.sh.
#
# Benchmark client (wrk) and the control daemon are excluded from
# classification; background interference is marked explicitly.

[targets]
process_names = nginx
exclude_names = wrk, schedpilotd, scx_schedpilot, redis-benchmark, sysbench

[bg]
process_names = stress-ng

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
lat_moderate = true
hysteresis_cycles = 10

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
