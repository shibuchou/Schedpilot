# SchedPilot flagship scenario: Redis + CPU/memory background interference
# co-location. The benchmark client is excluded from classification so client
# scheduling changes cannot pollute results.

[targets]
process_names = redis-server
exclude_names = redis-benchmark, memtier_benchmark, memtier, schedpilotd, scx_schedpilot

[bg]
# Interference tasks are marked explicitly (no automatic BG classification).
process_names = stress-ng

[classifier]
alpha = 0.3
wake_hi = 500
run_lo_ns = 2000000
delay_lo_ns = 500000
ipc_hi = 1.2
mpki_hi = 10.0
hysteresis_cycles = 10

[policy]
interval_ms = 100
adaptive = true
classify_pmu = true
llc_affinity = true
bg_contain = true
preempt = true

[log]
dir = logs
